services:
  db:
    image: postgres:16-alpine
    container_name: almacen_inventario_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-almacen}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-almacen123}
      POSTGRES_DB: ${POSTGRES_DB:-almacen}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-almacen} -d ${POSTGRES_DB:-almacen}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    container_name: almacen_inventario_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-almacen}:${POSTGRES_PASSWORD:-almacen123}@db:5432/${POSTGRES_DB:-almacen}
      AUTH_USER: ${AUTH_USER:?Define AUTH_USER en el .env}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?Define AUTH_PASSWORD en el .env}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Define AUTH_SECRET_KEY en el .env}
    ports:
      - "${API_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: almacen_inventario_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - api

volumes:
  db_data: